name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['4.2', '5.2', '6.0']
        exclude:
          # Django 4.2 does not support Python 3.14.
          - django-version: '4.2'
            python-version: '3.14'
          # Django 5.2 does not support Python 3.14.
          - django-version: '5.2'
            python-version: '3.14'
          # Django 6.0 supports Python 3.12 and up.
          - django-version: '6.0'
            python-version: '3.10'
          - django-version: '6.0'
            python-version: '3.11'
    services:
      postgres:
        image: postgres:14
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .[test]
        pip install "django~=${{ matrix.django-version }}.0"
    - name: Run tests
      env:
        DATABASE_USER: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_HOST: localhost
        DATABASE_PORT: ${{ job.services.postgres.ports[5432] }} # get randomly assigned published port
      run: |
        coverage run --parallel --omit='*migrations*' -m pytest -x
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5.5.2
      with:
        fail_ci_if_error: false
  lint_python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
    - name: Run linters
      run: make lint
  lint_js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        npm ci
    - name: Run linters
      run: |
        npm run eslint
  momand:
    name: Momand Super Store Django checks and MIS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: momand_test
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install Momand dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r backend/requirements.txt
    - name: Django checks and migration consistency
      working-directory: sandbox
      env:
        DATABASE_ENGINE: django.db.backends.postgresql
        DATABASE_NAME: momand_test
        DATABASE_USER: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
      run: |
        python manage.py check
        python manage.py makemigrations --check
        python manage.py migrate --noinput
    - name: MIS inventory tests
      working-directory: sandbox
      env:
        DATABASE_ENGINE: django.db.backends.postgresql
        DATABASE_NAME: momand_test
        DATABASE_USER: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
      run: |
        python manage.py test apps.mis --verbosity 2

  sandbox:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Build sandbox
      run: |
        python -m pip install --upgrade pip
        make sandbox
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Build docs
      run: |
        make docs
