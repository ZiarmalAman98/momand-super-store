databases:
  - name: momand-super-store-db
    databaseName: momand_store
    user: momand_store
    plan: free
    region: frankfurt

services:
  - type: web
    name: momand-super-store-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m pip install -r backend/requirements.txt && python backend/manage.py migrate --noinput && python backend/manage.py oscar_populate_countries --initial-only && python backend/manage.py collectstatic --noinput
    startCommand: python -m gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    initialDeployHook: python backend/manage.py createsuperuser --noinput && python backend/manage.py seed_roles && python backend/manage.py seed_data
    healthCheckPath: /api/v1/config/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: momand-super-store-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://momand-super-store.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: momand-super-store
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://momand-super-store-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://momand-super-store-api.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
